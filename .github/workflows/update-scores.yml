name: Update group-stage results

# Polls ESPN's public World Cup feed and writes finished group-stage scores into
# the "results" profile of pool.json, then commits. Knockout games (73-104) and
# all player brackets are never touched.

on:
  schedule:
    - cron: '*/15 * * * *'      # every 15 minutes (UTC); GitHub may delay/space these out
  workflow_dispatch: {}          # lets you run it on demand from the Actions tab

permissions:
  contents: write

concurrency:
  group: update-results
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch scores and update pool.json
        run: python scripts/update_scores.py
      - name: Commit and push if changed
        run: |
          if git diff --quiet -- pool.json; then
            echo "No changes to pool.json."
            exit 0
          fi
          git config user.name "wc2026-results-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pool.json
          git commit -m "Auto-update group-stage results [skip ci]"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
